version: 1

indices:
  # Magazine articles + adventure detail pages feed the dynamic listing blocks
  # (article-list and adventure-list) which fetch /query-index.json at runtime.
  default:
    include:
      - '/us/en/magazine/**'
      - '/us/en/adventures/**'
    exclude:
      - '/us/en/magazine'
      - '/us/en/adventures'
    target: /query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, 'content')
      category:
        select: head > meta[name="category"]
        value: attribute(el, 'content')
      tags:
        select: head > meta[name="tags"]
        value: attribute(el, 'content')
      date:
        select: head > meta[name="publication-date"]
        value: dateValue(attribute(el, 'content'), 'MM-DD-YYYY')
      lastModified:
        select: none
        value: parseTimestamp(headers('last-modified'), 'ddd, DD MMM YYYY hh:mm:ss GMT')
